# Render blueprint - one managed Postgres + one Node web service.
# In the Render dashboard: New + -> Blueprint -> point it at this repo.
# After the first deploy, load the schema + seed once (see README "Deploy").

databases:
  - name: chowly-db
    plan: free
    region: oregon
    databaseName: chowly
    user: chowly_app

services:
  - type: web
    name: chowly
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chowly-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
